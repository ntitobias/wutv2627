<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-modellövning</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body{
            background-color: #4e5460;
            margin: 0;
        }
        /* Ytterlådan (Container) */
        .container {
            max-width: 600px;
            background-color: #222222;
            padding: 20px; 
            margin: auto;
        }

        /* Kortet inuti */
        .card {
            background-color: #3b4252;
            color: #ffffff;
            padding: 20px;
            border: 4px solid #88c0d0;
            border-radius: 20px;    
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Om mig</h2>
            <p>Detta kort ska passa perfekt inuti den mörka ramen, men just nu sticker det ut till höger!</p>
        </div>
    </div>
</body>
</html>
