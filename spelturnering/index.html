<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelturnering</title>
    <style>
        body{
            background-color: darkslateblue;
            font-family: Arial, Helvetica, sans-serif;
            color: whitesmoke;
        }
        header{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3em;
        }
    
        nav ul{
            margin: 0;
            padding: 0;
            display: flex;
            gap: 3em;
            list-style-type: none;

        }

        nav a{
            color:aliceblue;
            text-decoration: none;
        }

        nav a:hover{
            background-color: aliceblue;
            color: darkslateblue;
        }

        .active{
            padding: 10px;
            border-radius: 10px;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="beige-logo.png" alt="NTI Gymnasiets logo">
        </div>
        <nav>
            <ul>
                <li><a href="" class="active">Hem</a></li>
                <li><a href="">Våra skolor</a></li>
                <li><a href="">Om oss</a></li>
            </ul>
        </nav>
    </header>
    
</body>
</html>
